# Оверлей для chaos-сценарію (README, «Chaos- і навантажувальні сценарії»):
#   (cd apps/api && npm ci && npm run chaos:sink:build)
#   docker compose -f docker-compose.yml -f docker-compose.chaos.yml up -d --build --wait
#   (cd apps/api && npm run chaos)
services:
  # Зовнішній отримувач http-кроків, що поважає Idempotency-Key і рахує ефекти.
  sink:
    networks:
      default:
        ipv4_address: 10.213.44.10
    image: node:20-alpine
    command: ["node", "/sink/chaos-sink.js"]
    volumes: ["./apps/api/dist/scripts:/sink:ro"]
    ports: ["8080:8080"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/stats > /dev/null || exit 1",
        ]
      interval: 2s
      retries: 20

  worker:
    environment:
      # Коротший lease: задачі вбитого воркера повертаються за секунди, а не за 30 с.
      JOB_LEASE_MS: "5000"
      HTTP_FIXTURE_ORIGIN: "http://sink:8080"
      HTTP_FIXTURE_ADDRESS: "10.213.44.10"
    depends_on:
      sink: { condition: service_healthy }

networks:
  default:
    ipam:
      config:
        - subnet: 10.213.44.0/24
