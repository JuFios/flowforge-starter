# Для локального запуску див. docs/operations.md, «Підготовка тестового стека».
services:
  # Зовнішній отримувач http-кроків, що поважає Idempotency-Key і рахує ефекти.
  sink:
    networks:
      chaos-receiver:
        ipv4_address: ${CHAOS_SINK_IP:-10.213.45.10}
    image: node:20-alpine
    command: ["node", "/sink/chaos-sink.js"]
    volumes: ["./apps/api/dist/scripts:/sink:ro"]
    ports: ["127.0.0.1:${CHAOS_SINK_PORT:-8080}:8080"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/stats > /dev/null || exit 1",
        ]
      interval: 2s
      retries: 20

  # API перевіряє endpoint сповіщень під час збереження (DNS і політика адрес): `sink` — дозволений
  # тестовий приймач, як і для воркера.
  api: &receiver-api
    networks: [default, chaos-receiver]
    environment:
      HTTP_FIXTURE_ORIGIN: "http://sink:8080"
      HTTP_FIXTURE_ADDRESS: "${CHAOS_SINK_IP:-10.213.45.10}"
    depends_on:
      sink: { condition: service_healthy }

  api-2:
    <<: *receiver-api

  worker:
    networks: [default, chaos-receiver]
    environment:
      # Коротший lease: задачі вбитого воркера повертаються за секунди, а не за 30 с.
      JOB_LEASE_MS: "5000"
      HTTP_FIXTURE_ORIGIN: "http://sink:8080"
      HTTP_FIXTURE_ADDRESS: "${CHAOS_SINK_IP:-10.213.45.10}"
    depends_on:
      sink: { condition: service_healthy }

networks:
  chaos-receiver:
    ipam:
      config:
        - subnet: ${CHAOS_SUBNET:-10.213.45.0/24}
