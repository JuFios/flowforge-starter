name: CI
on:
  push:
    branches: [main, solution]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (format, lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: api integration (real Postgres) and claim benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Verify first install in two databases on the clean cluster
        run: npx --no-install jest -c test/jest-cluster.json --runInBand
      - run: npm run test:integration
      # Пропускна здатність справедливого захоплення (README, «Бенчмарк захоплення»): відносно
      # FIFO попередньої версії на тому самому раннері — ≥ 50% пропускної здатності, p95 ≤ 3×,
      # і не менше 300 захоплень/с у кожному прогоні; інакше — провал.
      - run: npm run bench:claim

  frontend:
    name: frontend (format, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: docker-compose smoke (migrations from scratch)
    runs-on: ubuntu-latest
    # Верхня межа на весь job: жоден крок, що завис, не чекає 6-годинного ліміту GitHub.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Як у README «Запуск»: усі секрети — випадкові, у .env поруч із docker-compose.yml.
      - name: Generate the secrets
        run: |
          touch .env && chmod 600 .env && : > .env
          for name in ADMIN_TOKEN POSTGRES_PASSWORD API_DB_PASSWORD WORKER_DB_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> .env
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: docker compose build
      # --wait: compose чекає, поки migrate завершиться з кодом 0, а api, обидва воркери й
      # фронтенд стануть healthy; не дочекався за --wait-timeout або сервіс впав — помилка.
      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 180
      - name: Check migrations, API, frontend and both workers
        run: |
          migrate_exit="$(docker compose ps -a migrate --format '{{.ExitCode}}')"
          [ "$migrate_exit" = "0" ] || { echo "migrate exited with '$migrate_exit'"; exit 1; }
          curl -fsS --max-time 5 localhost:3000/ready; echo
          curl -fsS --max-time 5 -o /dev/null localhost:3001/login
          workers="$(docker compose ps -a -q worker)"
          count="$(printf '%s\n' "$workers" | grep -c . || true)"
          [ "$count" -eq 2 ] || { echo "expected 2 worker containers, found $count"; exit 1; }
          for c in $workers; do
            state="$(docker inspect -f '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$c")"
            [ "$state" = "running/healthy" ] || { echo "worker $c is $state"; exit 1; }
          done
      # Кожен сервіс отримує лише свої секрети (README, «Запуск»): власника схеми — лише postgres і
      # migrate, ADMIN_TOKEN — лише api, пароль ролі — лише її процес (і migrate, що створює ролі).
      - name: Check that every service gets only its own secrets
        run: |
          env_of() { docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$1"; }
          forbid() {  # контейнер, опис, заборонені змінні...; значення секретів шукаються всюди
            c="$1"; what="$2"; shift 2
            vars="$(env_of "$c")"
            for name in "$@"; do
              if printf '%s\n' "$vars" | grep -q "^$name="; then echo "$what gets $name"; exit 1; fi
              value="$(printenv "$name" || true)"
              if [ -n "$value" ] && printf '%s\n' "$vars" | grep -qF "$value"; then
                echo "$what gets the value of $name"; exit 1
              fi
            done
          }
          api="$(docker compose ps -q api)"
          forbid "$api" api POSTGRES_PASSWORD MIGRATION_DATABASE_URL WORKER_DB_PASSWORD
          for c in $(docker compose ps -a -q worker); do
            forbid "$c" worker ADMIN_TOKEN POSTGRES_PASSWORD MIGRATION_DATABASE_URL API_DB_PASSWORD
          done
          forbid "$(docker compose ps -a -q migrate)" migrate ADMIN_TOKEN
          # Runtime-ролі — без суперкористувача й BYPASSRLS.
          roles="$(docker compose exec -T postgres psql -U flowforge -d flowforge -tAc \
            "SELECT rolname || '|' || rolsuper || '|' || rolbypassrls FROM pg_roles
              WHERE rolname IN ('flowforge_api', 'flowforge_worker') ORDER BY 1")"
          echo "$roles"
          [ "$roles" = "$(printf 'flowforge_api|false|false\nflowforge_worker|false|false')" ] \
            || { echo 'runtime database roles are not as expected'; exit 1; }
      - name: Run a workflow end to end through a worker
        run: |
          tenant="$(curl -fsS --max-time 10 -X POST localhost:3000/tenants -H "x-admin-token: $ADMIN_TOKEN" \
            -H 'content-type: application/json' -d '{"name":"ci"}')"
          key="$(printf '%s' "$tenant" | jq -er .apiKey)"
          wf="$(curl -fsS --max-time 10 -X POST localhost:3000/workflows -H "x-api-key: $key" -H 'content-type: application/json' \
            -d '{"name":"smoke","steps":[{"id":"hello","type":"log","message":"hi {{ input.name }}"}]}' | jq -er .id)"
          exe="$(curl -fsS --max-time 10 -X POST "localhost:3000/workflows/$wf/run" -H "x-api-key: $key" -H 'x-request-id: ci-smoke-1' \
            -H 'content-type: application/json' -d '{"name":"ci"}' | jq -er .id)"
          status=
          for i in $(seq 1 30); do
            status="$(curl -fsS --max-time 10 "localhost:3000/executions/$exe" -H "x-api-key: $key" | jq -er .status)"
            [ "$status" = succeeded ] && break
            sleep 2
          done
          [ "$status" = succeeded ] || { echo "execution $exe is '$status'"; exit 1; }
          curl -fsS --max-time 10 "localhost:3000/executions/$exe" -H "x-api-key: $key" | jq -e '.correlationId == "ci-smoke-1"'
      # Chaos (README, «Chaos- і навантажувальні сценарії»): SIGKILL воркерів під навантаженням.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Build the chaos scripts
        working-directory: apps/api
        run: npm ci && npm run chaos:sink:build
      - name: Check that the chaos overlay preserves the live database network
        run: |
          diff <(docker compose config --format json | jq -S '.networks.default') \
               <(docker compose -f docker-compose.yml -f docker-compose.chaos.yml config --format json | jq -S '.networks.default')
      - name: Verify the receiver binding and shared outbound network policy
        env:
          HTTP_DENY_CIDRS: 203.0.113.0/24
        run: |
          docker compose -f docker-compose.yml -f docker-compose.chaos.yml config --format json |
            jq -e '.services as $s |
              $s.api.environment.HTTP_DENY_CIDRS == env.HTTP_DENY_CIDRS and
              $s.worker.environment.HTTP_DENY_CIDRS == env.HTTP_DENY_CIDRS and
              ($s.sink.ports | length == 1 and all(.host_ip == "127.0.0.1"))' > /dev/null
      - name: Add the chaos receiver and short worker leases
        run: docker compose -f docker-compose.yml -f docker-compose.chaos.yml up -d --wait --wait-timeout 180
      - name: Verify the tenant journey in Chromium through API failover
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          set -a
          source ../../.env
          set +a
          COMPOSE_PROJECT_NAME="$(docker compose ls --format json | jq -er '.[0].Name')" npx playwright test
      - name: Kill workers under load and verify exactly-once effects
        working-directory: apps/api
        run: npm run chaos
      - name: Restart Postgres under load and verify workers survive with exactly-once effects
        working-directory: apps/api
        run: npm run chaos:postgres
      # Вихідні сповіщення (ТЗ 3.3.9): рестарт Postgres під час доставки й втрачені підтвердження —
      # одна подія на завершення, повторна підписана доставка тих самих байтів із тим самим ID.
      - name: Deliver signed notifications through a database restart and lost acknowledgements
        working-directory: apps/api
        run: npm run chaos:notifications
      # Справедливе планування (ТЗ 3.3.5): тенант B під backlog-ом 20 000 задач тенанта A — критерії
      # у README, «Навантажувальний сценарій справедливого планування»; провал будь-якого — помилка.
      - name: Measure fair scheduling under the backlog of another tenant
        working-directory: apps/api
        run: npm run load:fairness
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.chaos.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.chaos.yml down -v
