name: CI
on:
  push:
    branches: [main, solution]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: api integration (real Postgres)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  frontend:
    name: frontend (lint, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: docker-compose smoke (migrations from scratch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for API, workers and frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:3000/ready > /dev/null && curl -fsS -o /dev/null localhost:3001/connect; then
              break
            fi
            sleep 3
          done
          curl -fsS localhost:3000/ready
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
          for c in $(docker compose ps -q worker); do
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$c")" = healthy ] && break
              sleep 2
            done
            test "$(docker inspect -f '{{.State.Health.Status}}' "$c")" = healthy
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
