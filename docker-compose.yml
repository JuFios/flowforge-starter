# Секрети — лише з .env у корені репозиторію (README, «Запуск»), кожен сервіс отримує тільки свої:
# власник схеми (POSTGRES_PASSWORD) — лише postgres і migrate, ADMIN_TOKEN — лише api, паролі
# runtime-ролей БД — migrate (створює ролі) і процес, якому роль належить.
x-api-image: &api-image
  build: ./apps/api
  # Лише несекретні налаштування; секрети в цьому файлі закоментовані.
  env_file: ./apps/api/.env.example

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у .env у корені репозиторію (див. README, розділ «Запуск»)}
      POSTGRES_DB: flowforge
    # Лише для хоста розробника (локальний запуск і тести поза docker); назовні порт не відкритий.
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowforge -d flowforge']
      interval: 3s
      retries: 20

  # Одноразовий крок: міграції (власником схеми) і створення/оновлення runtime-ролей БД.
  migrate:
    <<: *api-image
    command: ['sh', '-c', 'npm run db:migrate && npm run db:provision']
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgres://flowforge:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у .env}@postgres:5432/flowforge
      API_DB_USER: flowforge_api
      API_DB_PASSWORD: ${API_DB_PASSWORD:?задайте API_DB_PASSWORD у .env у корені репозиторію (див. README, розділ «Запуск»)}
      WORKER_DB_USER: flowforge_worker
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?задайте WORKER_DB_PASSWORD у .env у корені репозиторію (див. README, розділ «Запуск»)}
      # Ліміти тенантів за замовчуванням (README, «Контракт лімітів»): db:provision записує їх у
      # БД — одне джерело для API і воркера; перевизначення тенанта — адмін-API.
      TENANT_MAX_RUNNING: ${TENANT_MAX_RUNNING:-10}
      TENANT_MAX_WORKFLOWS: ${TENANT_MAX_WORKFLOWS:-1000}
      TENANT_MAX_QUEUE_SIZE: ${TENANT_MAX_QUEUE_SIZE:-100000}
      TENANT_RATE_LIMIT: ${TENANT_RATE_LIMIT:-600}
      TENANT_RATE_WINDOW_MS: ${TENANT_RATE_WINDOW_MS:-60000}
      TENANT_WEBHOOK_RATE_LIMIT: ${TENANT_WEBHOOK_RATE_LIMIT:-600}
      TENANT_WEBHOOK_RATE_WINDOW_MS: ${TENANT_WEBHOOK_RATE_WINDOW_MS:-60000}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *api-image
    environment:
      NODE_ENV: production
      HTTP_DENY_CIDRS: &http-deny-cidrs ${HTTP_DENY_CIDRS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?задайте ADMIN_TOKEN у .env у корені репозиторію (див. README, розділ «Запуск»)}
      # Роль API без BYPASSRLS (flowforge_api_role); пароль — лише символи [A-Za-z0-9].
      DATABASE_URL: postgres://flowforge_api:${API_DB_PASSWORD:?задайте API_DB_PASSWORD у .env}@postgres:5432/flowforge
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ['3000:3000']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ready > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *api-image
    command: ['node', 'dist/worker']
    environment:
      NODE_ENV: production
      HTTP_DENY_CIDRS: *http-deny-cidrs
      HTTP_STEP_TIMEOUT_MS: ${HTTP_STEP_TIMEOUT_MS:-15000}
      HTTP_RESPONSE_BYTES: ${HTTP_RESPONSE_BYTES:-1048576}
      # Роль воркера без BYPASSRLS (flowforge_worker_role). ADMIN_TOKEN воркер не отримує.
      DATABASE_URL: postgres://flowforge_worker:${WORKER_DB_PASSWORD:?задайте WORKER_DB_PASSWORD у .env}@postgres:5432/flowforge
    # Час між SIGTERM і SIGKILL: воркер чекає на задачі WORKER_SHUTDOWN_GRACE_MS (20 с), решту
    # повертає в чергу — тому запас тут більший.
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/ready > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./apps/frontend
    env_file: ./apps/frontend/.env.example
    depends_on:
      api: { condition: service_healthy }
    ports: ['3001:3000']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/connect > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
