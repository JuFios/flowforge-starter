x-api-image: &api-image
  build: ./apps/api
  env_file: ./apps/api/.env.example

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowforge -d flowforge']
      interval: 3s
      retries: 20

  # Одноразовий крок: застосовує міграції до старту API й воркерів.
  migrate:
    <<: *api-image
    command: ['npm', 'run', 'migration:run']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *api-image
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ['3000:3000']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ready > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *api-image
    command: ['node', 'dist/worker']
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/ready > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./apps/frontend
    env_file: ./apps/frontend/.env.example
    depends_on:
      api: { condition: service_healthy }
    ports: ['3001:3000']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/connect > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
